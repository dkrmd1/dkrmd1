<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="0.55" stop-color="#1a0b3d"/>
      <stop offset="1" stop-color="#03283a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9d"/>
      <stop offset="0.5" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00d9ff" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="900" height="260" rx="14"/></clipPath>
  </defs>

  <style>
    .title { font: 900 62px 'Courier New', monospace; letter-spacing: 8px; fill: url(#neon); animation: flicker 4s infinite; }
    .sub   { font: 700 17px 'Courier New', monospace; letter-spacing: 4px; fill: #ffffff; }
    .tag   { font: 700 14px 'Courier New', monospace; letter-spacing: 3px; fill: #00ff9d; }
    .start { font: 700 15px 'Courier New', monospace; letter-spacing: 4px; fill: #ff00ff; animation: blink 1.2s steps(1) infinite; }
    .scan  { animation: scan 3.5s linear infinite; }
    .border{ animation: pulse 2.5s ease-in-out infinite; }
    .s1 { animation: twinkle 2s infinite; }
    .s2 { animation: twinkle 3s infinite .7s; }
    .s3 { animation: twinkle 2.4s infinite 1.3s; }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes flicker { 0%,18%,22%,25%,53%,57%,100% { opacity: 1; } 20%,24%,55% { opacity: .4; } }
    @keyframes blink   { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes scan    { from { transform: translateY(-30px); } to { transform: translateY(290px); } }
    @keyframes pulse   { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#grid)"/>

    <!-- bintang kedip -->
    <rect class="s1" x="60"  y="40"  width="4" height="4" fill="#00ff9d"/>
    <rect class="s2" x="130" y="200" width="4" height="4" fill="#ff00ff"/>
    <rect class="s3" x="800" y="55"  width="4" height="4" fill="#00d9ff"/>
    <rect class="s1" x="850" y="190" width="4" height="4" fill="#00ff9d"/>
    <rect class="s2" x="720" y="225" width="4" height="4" fill="#ff00ff"/>
    <rect class="s3" x="250" y="30"  width="4" height="4" fill="#00d9ff"/>
    <rect class="s1" x="600" y="35"  width="4" height="4" fill="#ff00ff"/>

    <!-- ikon pixel melayang kiri & kanan -->
    <g class="float" fill="#00ff9d" filter="url(#glow)">
      <rect x="70" y="105" width="8" height="8"/><rect x="78" y="113" width="8" height="8"/>
      <rect x="86" y="121" width="8" height="8"/><rect x="78" y="129" width="8" height="8"/>
      <rect x="70" y="137" width="8" height="8"/>
    </g>
    <g class="float" fill="#ff00ff" filter="url(#glow)" style="animation-delay:1s">
      <rect x="822" y="105" width="8" height="8"/><rect x="814" y="113" width="8" height="8"/>
      <rect x="806" y="121" width="8" height="8"/><rect x="814" y="129" width="8" height="8"/>
      <rect x="822" y="137" width="8" height="8"/>
    </g>

    <!-- teks -->
    <text class="tag" x="450" y="70" text-anchor="middle">[ PLAYER ONE ]</text>
    <text class="title" x="450" y="135" text-anchor="middle" filter="url(#glow)">DIKI RAMDANI</text>
    <text class="sub" x="450" y="172" text-anchor="middle">WEB DEVELOPER  |  LARAVEL &amp; PHP</text>
    <text class="start" x="450" y="225" text-anchor="middle">&gt; PRESS START &lt;</text>

    <!-- garis scan bergerak -->
    <rect class="scan" x="0" y="0" width="900" height="6" fill="#00d9ff" opacity="0.18"/>
  </g>

  <!-- bingkai neon berdenyut -->
  <rect class="border" x="3" y="3" width="894" height="254" rx="12" fill="none" stroke="url(#neon)" stroke-width="3"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
